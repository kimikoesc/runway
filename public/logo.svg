  <path d="M11.81 17.5 L20.19 17.5 L19.38 11.5 L12.62 11.5 Z" fill="#f28c28"/>
  <path d="M13.02 8.5 L18.98 8.5 L18.44 4.5 L13.56 4.5 Z" fill="#e8e4da"/>
